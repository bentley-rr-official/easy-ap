name: Build Windows EXE (2025RR)

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name 2025RR easy_ap_gui.py

      - name: Prepare artifact
        shell: pwsh
        run: |
          Copy-Item dist/2025RR.exe dist/2025RR-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: 2025RR-windows-x64
          path: dist/2025RR-windows-x64.exe
