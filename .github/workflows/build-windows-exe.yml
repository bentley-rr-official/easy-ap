name: Build Windows EXE (Rec Room 2025 Android Patch Tool)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RecRoom2025AndroidPatchTool easy_ap_gui.py

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/RecRoom2025AndroidPatchTool.exe dist/package/
          Copy-Item README.md dist/package/
          Copy-Item recroom-2025-patch-settings.example.json dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/RecRoom2025AndroidPatchTool-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecRoom2025AndroidPatchTool-windows-x64
          path: dist/RecRoom2025AndroidPatchTool-windows-x64.zip
